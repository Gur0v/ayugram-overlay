name: build-binpkg

on:
  workflow_dispatch:
    inputs:
      version:
        description: "package version (e.g. 6.7.8)"
        required: true
        default: "6.7.8"

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: net-im/ayugram-desktop-bin-${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    container:
      image: gentoo/stage3:amd64-desktop-openrc
      options: --privileged

    env:
      PKGDIR: /var/cache/binpkgs
      CCACHE_DIR: /var/cache/ccache

    steps:
      - name: mkdirs
        run: |
          mkdir -p \
            "${PKGDIR}" \
            "${CCACHE_DIR}" \
            /var/db/repos/gentoo

      - name: cache-key
        id: cache-key
        run: |
          printf 'week=%s\n' "$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: cache-portage
        uses: actions/cache@v4
        with:
          path: /var/db/repos/gentoo
          key: portage-${{ runner.os }}-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            portage-${{ runner.os }}-

      - name: sync
        run: |
          [[ -f /var/db/repos/gentoo/profiles/base/eapi ]] || emerge-webrsync -q
          emerge --sync

      - name: install-git
        run: |
          emerge --getbinpkg -q dev-vcs/git

      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: next-revision
        id: rev
        run: |
          EBUILD_DIR="${GITHUB_WORKSPACE}/net-im/ayugram-desktop-bin"

          LAST=$(ls "${EBUILD_DIR}/ayugram-desktop-bin-${{ inputs.version }}"*.ebuild 2>/dev/null \
            | sort -V | tail -1)

          if [[ -z "$LAST" ]]; then
            echo "Error: no base ebuild found for ${{ inputs.version }}"
            exit 1
          fi

          if [[ "$LAST" =~ -r([0-9]+)\.ebuild$ ]]; then
            NEXT_R=$(( ${BASH_REMATCH[1]} + 1 ))
          else
            NEXT_R=1
          fi

          PVR="${{ inputs.version }}-r${NEXT_R}"
          TAG="v${PVR}"
          NEW_EBUILD="${EBUILD_DIR}/ayugram-desktop-bin-${PVR}.ebuild"

          cp "$LAST" "$NEW_EBUILD"

          printf 'pvr=%s\ntag=%s\nnew_ebuild=%s\n' \
            "$PVR" "$TAG" "$NEW_EBUILD" >> "$GITHUB_OUTPUT"

      - name: cache-binpkgs
        uses: actions/cache@v4
        with:
          path: ${{ env.PKGDIR }}
          key: binpkgs-${{ runner.os }}-${{ hashFiles('media-libs/**', 'net-im/**', 'dev-cpp/**') }}
          restore-keys: |
            binpkgs-${{ runner.os }}-

      - name: cache-distfiles
        uses: actions/cache@v4
        with:
          path: /var/cache/distfiles/git3-src
          key: distfiles-git-${{ runner.os }}-${{ hashFiles('net-im/**', 'media-libs/**') }}
          restore-keys: |
            distfiles-git-${{ runner.os }}-

      - name: cache-ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ hashFiles('net-im/**', 'media-libs/**', 'dev-cpp/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: ccache-install
        run: |
          emerge -1qv dev-util/ccache

      - name: overlay
        run: |
          mkdir -p /etc/portage/repos.conf

          cat > /etc/portage/repos.conf/ayugram-overlay.conf <<EOF
          [ayugram-overlay]
          location = ${GITHUB_WORKSPACE}
          masters = gentoo
          auto-sync = no
          priority = 9999
          EOF

      - name: configure
        run: |
          cat >> /etc/portage/make.conf <<EOF
          COMMON_FLAGS="-march=x86-64-v2 -O2 -pipe"
          CFLAGS="\${COMMON_FLAGS}"
          CXXFLAGS="\${COMMON_FLAGS}"
          MAKEOPTS="-j$(nproc)"
          BINPKG_FORMAT="gpkg"
          PKGDIR="${PKGDIR}"
          CCACHE_DIR="${CCACHE_DIR}"
          FEATURES="buildpkg buildpkg-live getbinpkg ccache -binpkg-request-signature -ipc-sandbox -network-sandbox -pid-sandbox"
          EMERGE_DEFAULT_OPTS="--jobs=$(nproc) --with-bdeps=y --complete-graph=y"
          EOF

          mkdir -p \
            /etc/portage/env \
            /etc/portage/package.accept_keywords \
            /etc/portage/package.env \
            /etc/portage/package.use

          chown -R root:portage "${CCACHE_DIR}"
          chmod 2775 "${CCACHE_DIR}"

          cat > "${CCACHE_DIR}/ccache.conf" <<EOF
          max_size = 50G
          compression = true
          sloppiness = pch_defines,time_macros
          EOF

          cat > /etc/portage/env/nolto.conf <<EOF
          COMMON_FLAGS="\${COMMON_FLAGS} -fno-lto"
          EOF

          cat > /etc/portage/package.env/ayugram <<EOF
          media-libs/tg_owt nolto.conf
          net-im/ayugram-desktop nolto.conf
          EOF

          cat > /etc/portage/package.use/ayugram <<EOF
          media-video/ffmpeg opus vpx
          sys-libs/minizip-ng compat
          EOF

          cat > /etc/portage/package.accept_keywords/ayugram <<EOF
          >=media-libs/tg_owt-0_pre20260309 **
          =net-im/ayugram-desktop-${{ inputs.version }} **
          dev-cpp/cppgir **
          EOF

      - name: build
        run: |
          emerge -1v \
            dev-vcs/git \
            "=net-im/ayugram-desktop-${{ inputs.version }}::ayugram-overlay"

      - name: ccache-stats
        if: always()
        run: |
          ccache -s

      - name: collect
        run: |
          mkdir -p dist

          AYUGRAM_PKG=$(find "${PKGDIR}" -type f \
            -name "ayugram-desktop-${{ inputs.version }}*.gpkg.tar" \
            | sort -V | tail -n 1)

          if [[ -z "$AYUGRAM_PKG" ]]; then
            echo "Error: ayugram-desktop binary package not found!"
            exit 1
          fi

          OUT_FILE="ayugram-desktop-${{ inputs.version }}.gpkg.tar"

          cp -v "$AYUGRAM_PKG" "dist/${OUT_FILE}"

          cd dist

          sha256sum "${OUT_FILE}" > "${OUT_FILE}.sha256"

          test -f "${OUT_FILE}"
          test -f "${OUT_FILE}.sha256"

      - name: manifest
        run: |
          cp "dist/ayugram-desktop-${{ inputs.version }}.gpkg.tar" /var/cache/distfiles/
          ebuild "${{ steps.rev.outputs.new_ebuild }}" manifest

      - name: commit
        run: |
          cd "${GITHUB_WORKSPACE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add net-im/ayugram-desktop-bin/

          git commit -m "net-im/ayugram-desktop-bin: rebuild ${{ steps.rev.outputs.pvr }}"

          git push

      - name: purge-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - "${{ steps.rev.outputs.tag }}" <<'PYEOF'
          import json
          import os
          import sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          tag = sys.argv[1]
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]

          base = f"https://api.github.com/repos/{repo}"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method, path):
              try:
                  req = Request(
                      f"{base}{path}",
                      headers=headers,
                      method=method,
                  )
                  urlopen(req)
              except HTTPError as e:
                  if e.code not in (404, 422):
                      raise

          def get(path):
              try:
                  req = Request(
                      f"{base}{path}",
                      headers=headers,
                  )
                  return json.load(urlopen(req))
              except HTTPError as e:
                  if e.code == 404:
                      return None
                  raise

          rel = get(f"/releases/tags/{tag}")

          if rel:
              api("DELETE", f"/releases/{rel['id']}")

          api("DELETE", f"/git/refs/tags/{tag}")
          PYEOF

      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-desktop-${{ steps.rev.outputs.pvr }}-binpkg
          path: |
            dist/*.gpkg.tar
            dist/*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rev.outputs.tag }}
          files: |
            dist/*.gpkg.tar
            dist/*.sha256
          fail_on_unmatched_files: true
